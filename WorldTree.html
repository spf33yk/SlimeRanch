.ui-v2 .world-tree-actions button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 0 0 1px #593e1d,inset 0 1px #fff9,0 8px 22px #000b;}
.ui-v2 .world-tree-actions button:focus-visible{outline:3px solid #fff3b8;outline-offset:3px;}
.ui-v2 .world-tree-primary{width:min(460px,56vw);background:linear-gradient(180deg,#62774b,#354d36 58%,#263a30);}

.ui-v2 .world-tree-primary{touch-action:none;user-select:none;-webkit-user-select:none;}
.ui-v2 .world-tree-primary.is-donating{filter:brightness(1.16);transform:translateY(-1px);}

.ui-v2 .world-tree-progress{position:relative;z-index:0;max-width:100%;font-size:11px;font-weight:700;color:#e8e2cb;font-variant-numeric:tabular-nums;}
.ui-v2 .world-tree-skills{width:min(300px,38vw);border-color:#a9bdc5!important;background:linear-gradient(180deg,#485d68,#2a3942 65%,#1c292f)!important;}

.ui-v2 .world-tree-skills-view{width:min(1100px,calc(100vw - 28px));min-height:min(78dvh,850px);margin:0 auto;padding:clamp(16px,3vw,32px);overflow:auto;border:1px solid #677b72;border-radius:6px;background:radial-gradient(ellipse at 50% 0%,#385043,#202a2b 65%,#171e23);box-shadow:inset 0 1px #ffffff1a,0 8px 26px #0008;}

.ui-v2 .world-tree-skills-head button{white-space:nowrap;}
.ui-v2 .world-tree-skills-note{color:#c1c8c4;font-size:12px;line-height:1.7;}
.ui-v2 .world-tree-empty{grid-column:1/-1;min-height:230px;display:grid;place-content:center;justify-items:center;gap:8px;padding:24px;border:1px dashed #788777;border-radius:6px;background:linear-gradient(145deg,#28332d,#20282b);color:#e6d49e;text-align:center;}

.ui-v2 .world-tree-skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}

.ui-v2 .world-tree-skill h3{margin:0;color:#e6d49e;font-size:14px;}

.ui-v2 .world-tree-ascension-dialog{width:min(620px,calc(100vw - 28px));max-height:min(88dvh,760px);overflow:auto;border:1px solid #d9bf79;background:linear-gradient(160deg,#303735,#1b2226);color:#e8e2cb;box-shadow:0 18px 64px #000c,inset 0 1px #ffffff20;}
.ui-v2 .world-tree-ascension-dialog::backdrop{background:#080c12c9;backdrop-filter:blur(4px);}
.ui-v2 .world-tree-ascension-dialog .world-tree-ascension-warning{padding:12px;border:1px solid #8e7240;border-radius:4px;background:#352e22;color:#f2e2b9;font-size:12px;line-height:1.7;}
.ui-v2 .world-tree-ascension-dialog label{display:block;margin:14px 0 6px;color:#d2e5e0;font-weight:800;}
.ui-v2 .world-tree-ascension-dialog select{width:100%;min-height:46px;padding:8px 10px;border:1px solid #69777b;border-radius:4px;background:#1b2126;color:#f2eddf;font:inherit;}
.ui-v2 .world-tree-ascension-dialog .world-tree-carry-preview{min-height:38px;margin:8px 0;padding:9px 11px;border:1px solid #52605a;border-radius:4px;background:#202a29;color:#c6d6c5;font-size:12px;line-height:1.6;}
@media(max-width:700px){
 .ui-v2 .world-tree-scene{height:calc(100dvh - 155px);min-height:440px;max-height:760px;background-position:center;}
 .ui-v2 .world-tree-art{object-fit:cover;object-position:center center;}
 .ui-v2 .world-tree-vignette{background:linear-gradient(180deg,#080c1350,transparent 28%,#090e13bb 64%,#090e13ed 100%);}
 .ui-v2 .world-tree-actions{flex-direction:column;gap:8px;padding:14px 16px max(18px,env(safe-area-inset-bottom));}
 .ui-v2 .world-tree-actions button{width:100%;min-height:58px;font-size:15px;}
 .ui-v2 .world-tree-skill-list{grid-template-columns:1fr;}
 .ui-v2 .world-tree-skill{padding:11px;}
}
@media(max-width:700px) and (orientation:landscape){.ui-v2 .world-tree-scene{height:calc(100dvh - 130px);min-height:300px}.ui-v2 .world-tree-actions{flex-direction:row;align-items:end}.ui-v2 .world-tree-actions button{min-height:54px}.ui-v2 .world-tree-primary{width:min(420px,58vw)}.ui-v2 .world-tree-skills{width:min(280px,36vw)}}
/* Keep the World Tree artwork and its frame inside the shared header's viewport area. */
.ui-v2 #worldtree.scene-enter{animation:world-tree-fade .24s ease-out both}
@keyframes world-tree-fade{from{opacity:0}to{opacity:1}}
.ui-v2 #worldtree.active .world-tree-scene{position:fixed;top:var(--world-tree-top,120px);right:12px;bottom:12px;left:12px;z-index:1;width:auto;height:auto;min-height:0;max-height:none;border-radius:0}
.ui-v2 #worldtree.active{min-height:1px}
.ui-v2 #worldtree.active .world-tree-art{object-fit:cover;object-position:center center}
body.ui-v2:has(#worldtree.active) #uiTopbar{background:#23272cdb;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media(max-width:700px){.ui-v2 #worldtree.active{min-height:1px}}
@media(max-width:700px) and (orientation:landscape){.ui-v2 #worldtree.active{min-height:1px}}
@media(prefers-reduced-motion:reduce){.ui-v2 .world-tree-art,.ui-v2 .world-tree-actions button{transition:none}}
</style>
<script>
const WORLD_TREE_COSTS=[1e3,2500,5000,9000,15000,23000,33000,46000,62000,0];
const WORLD_TREE_SKILLS={
 vitality:{name:'根の守り',icon:'🛡️',description:'チームの最大HPが1段階ごとに10%上昇。',costs:[1,1,2,3,5]},
 might:{name:'大樹の力',icon:'⚔️',description:'チームの攻撃力が1段階ごとに5%上昇。',costs:[1,1,2,3,5]},
 resonance:{name:'魔素共鳴',icon:'✨',description:'魔素の取得量が1段階ごとに5%上昇。',costs:[1,1,2,3,5]},
 fortune:{name:'生命の祝福',icon:'💗',description:'ハートのドロップ率が1段階ごとに0.5ポイント上昇。',costs:[1,1,2,3,5]}
};
function worldTreeEnsure(){
 if(!g||typeof g!=='object')return;
 g.worldTreeStage=Math.max(1,Math.min(10,Math.floor(Number(g.worldTreeStage)||1)));
 g.worldTreeMaso=Math.max(0,Number(g.worldTreeMaso)||0);
 g.worldTreeEnergy=Math.max(0,Number(g.worldTreeEnergy)||0);
 if(!g.worldTreeSkills||typeof g.worldTreeSkills!=='object')g.worldTreeSkills={};
 for(const [key,skill] of Object.entries(WORLD_TREE_SKILLS))g.worldTreeSkills[key]=Math.max(0,Math.min(skill.costs.length,Math.floor(Number(g.worldTreeSkills[key])||0)));
}
function worldTreeCost(){return WORLD_TREE_COSTS[g.worldTreeStage-1]||0}
function worldTreeMinimumBreakthrough(){return Math.min(1000,Math.max(1,g.worldTreeStage)*100)}
function worldTreeHighestBreakthrough(){return Math.max(0,...Object.keys(g.clearedStages||{}).filter(stage=>g.clearedStages[stage]).map(Number).filter(Number.isFinite))}
function worldTreeBreakthroughReached(){return worldTreeHighestBreakthrough()>=worldTreeMinimumBreakthrough()}
function worldTreeAscensionReward(){return 1}
function worldTreeGameCleared(){return g.worldTreeStage>=10&&!!g.clearedStages?.[1000]}
function worldTreeArtPath(stage){return 'assets/game-art/world-tree/stage-'+String(stage).padStart(2,'0')+'.webp'}
function worldTreeSyncFrame(){const topbar=document.getElementById('uiTopbar'),scene=document.getElementById('worldTreeMainView');if(!topbar||!scene)return;scene.style.setProperty('--world-tree-top',Math.ceil(topbar.getBoundingClientRect().bottom+8)+'px')}
function worldTreeSelectedMonster(){return g.slimes.find(monster=>monster.id===Number(document.getElementById('worldTreeCarryMonster')?.value))||null}
function worldTreeCanAscend(){worldTreeEnsure();return g.worldTreeStage<10&&g.worldTreeMaso>=worldTreeCost()&&worldTreeBreakthroughReached()}
function worldTreeRenderCarryPreview(){
 const monster=worldTreeSelectedMonster(),preview=document.getElementById('worldTreeCarryPreview');if(!preview)return;
 if(!monster){preview.textContent='引き継ぐモンスターを選択してください。';return}
 const slots=[];if(Number(monster.id)===Number(g.main))slots.push('main');if(Number(monster.id)===Number(g.sub))slots.push('sub');
 const charms=slots.map(slot=>g.treasureCharms?.find(charm=>charm.id===g.treasureEquip?.[slot])).filter(Boolean);
 preview.textContent=monsterDisplayName(monster)+' · Lv.'+monster.level+' · '+getType(monster)+(charms.length?' · 装備維持：'+charms.map(charm=>charm.name).join('／'):' · 装備中のおまもりなし');
}
function worldTreeOpenAscension(){
 worldTreeEnsure();const dialog=document.getElementById('worldTreeAscensionDialog'),select=document.getElementById('worldTreeCarryMonster');
 if(!dialog||dialog.open||!worldTreeCanAscend())return;
 select.innerHTML=g.slimes.map(monster=>'<option value="'+monster.id+'">'+(monster.id===Number(g.main)?'★ メイン · ':monster.id===Number(g.sub)?'サブ · ':'')+monsterDisplayName(monster)+' · Lv.'+monster.level+' · '+getType(monster)+'</option>').join('');
 select.value=String(g.main??g.slimes[0]?.id??'');document.getElementById('worldTreeAscensionRewardText').textContent='突破確認：STAGE '+worldTreeMinimumBreakthrough()+'　／　今回の獲得：'+fmt(worldTreeAscensionReward())+' EP　／　引き継ぐ魔素：'+fmt(g.maso)+'　／　世界樹：第'+g.worldTreeStage+'段階 → 第'+(g.worldTreeStage+1)+'段階';
 worldTreeRenderCarryPreview();dialog.showModal();sfx('tap');
}
function worldTreeAscend(monsterId){
 worldTreeEnsure();const cost=worldTreeCost(),monster=g.slimes.find(candidate=>candidate.id===Number(monsterId));
 if(g.worldTreeStage>=10||!cost||g.worldTreeMaso<cost||!worldTreeBreakthroughReached()||!monster)return false;
 const reward=worldTreeAscensionReward(),carriedMonster=JSON.parse(JSON.stringify(monster));carriedMonster.locked=true;
 const equipment={...(g.treasureEquip||{main:null,sub:null})},selectedSlot=Number(monster.id)===Number(g.sub)?'sub':'main';
 const carry={maso:Number(g.maso)||0,worldTreeStage:g.worldTreeStage+1,worldTreeEnergy:g.worldTreeEnergy+reward,worldTreeSkills:{...g.worldTreeSkills},treasureChests:JSON.parse(JSON.stringify(g.treasureChests||[])),treasureCharms:JSON.parse(JSON.stringify(g.treasureCharms||[])),treasureEquip:{main:selectedSlot==='sub'?(equipment.sub||null):(equipment.main||null),sub:null},treasureNextId:Math.max(1,Number(g.treasureNextId)||1),seenSpecies:{...(g.seenSpecies||{})},seenEnemies:{...(g.seenEnemies||{})},nextId:Math.max(Number(g.nextId)||1,Number(carriedMonster.id)+1),autoNext:!!g.autoNext,firstFusionUsed:!!g.firstFusionUsed};
 Object.assign(g,fresh(),carry,{worldTreeMaso:0,slimes:[carriedMonster],main:carriedMonster.id,sub:null,monsterCapacity:100,tiles:makeTiles(2),stage:1,maxStage:1,enemyHP:36,teamHP:1,won:false,clearedStages:{},kills:0,wins:0,fails:0,hearts:0,heartItems:[],logs:[],bLogs:[],autoFight:false});
 g.teamHP=teamMax();g.enemyHP=enemyMax(1);document.getElementById('worldTreeAscensionDialog').close();sfx('win');log('🌳 アセンション完了：'+monsterDisplayName(carriedMonster)+'・魔素・おまもりと装備を引き継ぎ、エネルギーポイント +'+reward);save();render();return true;
}
function worldTreeRender(){
 const scene=document.querySelector('.world-tree-scene');if(!scene||!g)return;worldTreeEnsure();
 const image=document.getElementById('worldTreeArt'),primary=document.getElementById('worldTreePrimary'),label=document.getElementById('worldTreeActionLabel'),progress=document.getElementById('worldTreeProgress'),skillsButton=document.getElementById('worldTreeSkillsButton');
 const required=worldTreeMinimumBreakthrough(),highest=worldTreeHighestBreakthrough(),breakthrough=worldTreeBreakthroughReached(),complete=worldTreeGameCleared();
 const art=worldTreeArtPath(g.worldTreeStage);if(scene.dataset.art!==art){scene.dataset.art=art;scene.style.backgroundImage='linear-gradient(#10151a33,#10151a33),url("'+art+'")';}if(image.getAttribute('src')!==art){image.classList.add('is-changing');image.onload=()=>image.classList.remove('is-changing');image.src=art;image.alt='世界樹 成長段階 '+g.worldTreeStage+' / 10';}
 const max=worldTreeCost(),remaining=Math.max(0,max-g.worldTreeMaso),ready=g.worldTreeStage<10&&remaining<=0&&breakthrough;
 primary.disabled=g.worldTreeStage>=10;primary.classList.toggle('is-ascension',ready);
 if(complete){label.textContent='🌟 世界樹が完全復活 · ゲームクリア';progress.textContent='全10段階 · STAGE 1000突破達成';}
 else if(g.worldTreeStage>=10){label.textContent='🌳 世界樹は完全に復活した';progress.textContent='STAGE 1000を突破してゲームクリア';}
 else if(ready){label.textContent='🌟 アセンション';progress.textContent='獲得 '+worldTreeAscensionReward()+' EP · STAGE '+required+'突破';}
 else if(remaining<=0){label.textContent='🔒 突破条件を達成しよう';progress.textContent='STAGE '+required+'クリア · 現在の最高突破 '+highest;}
 else {label.textContent=primary.classList.contains('is-donating')?'🌱 魔素を捧げています…':'🌱 魔素を捧げる（長押し）';progress.textContent=fmt(g.worldTreeMaso)+' / '+fmt(max)+' 魔素 · 長押しで投入 · STAGE '+required+'突破';}
 const unlocked=g.worldTreeStage>=2;skillsButton.disabled=!unlocked;skillsButton.textContent=unlocked?'🌿 スキルツリー　·　'+fmt(g.worldTreeEnergy)+' EP':'🔒 スキルツリー（2段階目で解放）';
 if(!document.getElementById('worldTreeSkillsView')?.hidden)worldTreeRenderSkills();
}
function worldTreeRenderSkills(){
 worldTreeEnsure();const points=document.getElementById('worldTreeSkillsPoints'),list=document.getElementById('worldTreeSkillList');if(!points||!list)return;
 points.textContent='エネルギーポイント：'+fmt(g.worldTreeEnergy)+' EP';
 list.innerHTML='<div class="world-tree-empty"><span>🌱</span><strong>スキルツリーは準備中</strong><p>アセンションごとに1 EPを獲得します。今後、1ポイントずつ効果を選んで振り分ける形で追加します。</p></div>';
}
const WORLD_TREE_HOLD_DELAY=320,WORLD_TREE_HOLD_INTERVAL=100;
let worldTreeHoldDelay=null,worldTreeHoldInterval=null,worldTreeHoldActive=false,worldTreeHoldPointer=null,worldTreeHoldPulseCount=0;
function worldTreeStopDonateHold(){
 const wasHolding=worldTreeHoldDelay!==null||worldTreeHoldInterval!==null||worldTreeHoldActive;
 if(worldTreeHoldDelay!==null)clearTimeout(worldTreeHoldDelay);if(worldTreeHoldInterval!==null)clearInterval(worldTreeHoldInterval);
 worldTreeHoldDelay=null;worldTreeHoldInterval=null;worldTreeHoldActive=false;worldTreeHoldPointer=null;
 document.getElementById('worldTreePrimary')?.classList.remove('is-donating');
 if(wasHolding&&g)worldTreeRender();
}
function worldTreeDonatePulse(){
 worldTreeEnsure();const cost=worldTreeCost();if(!cost||g.worldTreeStage>=10){worldTreeStopDonateHold();return false}
 if(g.worldTreeMaso>=cost){worldTreeStopDonateHold();if(!worldTreeBreakthroughReached()){$('worldTreeProgress').textContent='STAGE '+worldTreeMinimumBreakthrough()+'クリア · 現在 '+worldTreeHighestBreakthrough();sfx('fail');return false}worldTreeOpenAscension();return false}
 const amount=Math.min(Math.max(0,Number(g.maso)||0),cost-g.worldTreeMaso,Math.max(1,Math.min(1000,Math.ceil(cost*.25))));if(amount<=0){worldTreeStopDonateHold();sfx('fail');return false}
 g.maso-=amount;g.worldTreeMaso+=amount;if(worldTreeHoldPulseCount++%4===0)sfx('buy');save();render();
 if(g.worldTreeMaso>=cost)worldTreeStopDonateHold();
 return true;
}
function worldTreeStartDonateHold(event){
 if(event?.type==='pointerdown'&&event.button!==0)return;
 if(worldTreeCanAscend())return;
 event?.preventDefault?.();if(worldTreeHoldDelay!==null||worldTreeHoldActive)return;
 worldTreeHoldPointer=event?.pointerId??null;worldTreeHoldPulseCount=0;
 if(event?.pointerId!==undefined){try{event.currentTarget?.setPointerCapture(event.pointerId)}catch{}}
 worldTreeHoldDelay=setTimeout(()=>{
  worldTreeHoldDelay=null;worldTreeHoldActive=true;document.getElementById('worldTreePrimary')?.classList.add('is-donating');
  if(worldTreeDonatePulse()&&worldTreeHoldActive&&g.worldTreeMaso<worldTreeCost())worldTreeHoldInterval=setInterval(worldTreeDonatePulse,WORLD_TREE_HOLD_INTERVAL);
 },WORLD_TREE_HOLD_DELAY);
}
function worldTreeEndDonateHold(event){
 worldTreeStopDonateHold();
}
function worldTreeBuySkill(key){
 worldTreeEnsure();const skill=WORLD_TREE_SKILLS[key];if(!skill||g.worldTreeStage<2)return;
 const level=g.worldTreeSkills[key],cost=skill.costs[level];if(cost===undefined||g.worldTreeEnergy<cost)return;
 g.worldTreeEnergy-=cost;g.worldTreeSkills[key]++;sfx('buy');save();render();
}
const worldTreeBaseBattleStats=teamBattleStats;
teamBattleStats=function(){worldTreeEnsure();const stats=worldTreeBaseBattleStats();stats.hp*=1+g.worldTreeSkills.vitality*.1;stats.atk*=1+g.worldTreeSkills.might*.05;return stats};
const worldTreeBaseFarmStats=teamFarmStats;
teamFarmStats=function(){worldTreeEnsure();const stats=worldTreeBaseFarmStats();stats.masoGain+=g.worldTreeSkills.resonance*5;stats.heart+=g.worldTreeSkills.fortune*.5;return stats};
const worldTreeBaseRender=render;
render=function(options){const result=worldTreeBaseRender(options);worldTreeRender();return result};
document.addEventListener('DOMContentLoaded',()=>{
 worldTreeEnsure();worldTreeSyncFrame();requestAnimationFrame(worldTreeSyncFrame);window.addEventListener('resize',worldTreeSyncFrame,{passive:true});window.addEventListener('scroll',worldTreeSyncFrame,{passive:true});const topbar=document.getElementById('uiTopbar');if(topbar&&typeof ResizeObserver!=='undefined')new ResizeObserver(worldTreeSyncFrame).observe(topbar);worldTreeRender();
 const donateButton=document.getElementById('worldTreePrimary');
 donateButton.addEventListener('pointerdown',worldTreeStartDonateHold);donateButton.addEventListener('pointerup',worldTreeEndDonateHold);donateButton.addEventListener('pointercancel',worldTreeEndDonateHold);donateButton.addEventListener('lostpointercapture',worldTreeEndDonateHold);donateButton.addEventListener('contextmenu',event=>event.preventDefault());
