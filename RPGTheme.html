<style id="slime-rpg-ui-v2">
html{scrollbar-gutter:stable}
/* v0.2 UI: original game IDs and save schema are preserved. */

body.ui-v2{--bg:#15171b;--p:#272b30;--l:#656c73;--t:#f1eee5;--m:#bfc2c6;--g:#b4d78b;--y:#e8cf97;background:radial-gradient(ellipse at top,#3b4149,#191c22 65%);color:var(--t);font-family:"PixelMplus10",system-ui,sans-serif;min-height:100vh}
.ui-v2 *{scrollbar-color:#72787f #202328;scrollbar-width:thin}
.ui-v2 header,.ui-v2 main,.ui-v2 nav{max-width:1240px;margin:auto}
.ui-v2 header{padding:18px 22px 14px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ui-v2 .brand{font-size:27px;white-space:nowrap;letter-spacing:.06em;text-shadow:2px 3px #090a0c}
.ui-v2 header>.small{display:none}
.ui-v2 .resources{display:flex;gap:8px;margin:0 0 0 auto;flex-wrap:wrap}
.ui-v2 .resource{display:flex;gap:10px;align-items:center;min-width:106px;padding:9px 14px;border:1px solid #85898d;border-radius:4px;background:linear-gradient(#32373f,#1a1e24);box-shadow:inset 0 0 0 2px #11151b,0 2px 0 #0b0c0f}
.ui-v2 .resource b{font-size:20px;color:#e9f3fa;font-variant-numeric:tabular-nums}
.ui-v2 .resource small{font-size:12px;color:#c2c6cb}
.ui-v2 #mps{display:none}
.ui-v2 nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:0 22px 14px;position:sticky;top:0;z-index:30;background:#23272cf5}
.ui-v2 button,.ui-v2 select,.ui-v2 input{font:inherit}
.ui-v2 button,.ui-v2 .screen button{border:1px solid #838990;border-radius:4px;color:#f4f3ee;min-height:44px;padding:10px 15px;background:linear-gradient(#545a62,#363b43 48%,#2b3038);box-shadow:inset 0 1px #b5b6b854,inset 0 -2px #17191f,0 2px 3px #0006;text-shadow:1px 2px #17191f;transition:filter .15s,transform .15s}
.ui-v2 button:hover:not(:disabled){filter:brightness(1.18)}
.ui-v2 button:active:not(:disabled){transform:translateY(1px)}
.ui-v2 button:disabled{opacity:.48;cursor:not-allowed}
.ui-v2 button:focus-visible,.ui-v2 select:focus-visible,.ui-v2 input:focus-visible,.ui-v2 summary:focus-visible{outline:2px solid #a6dfff;outline-offset:3px}
.ui-v2 nav button{position:relative;min-height:52px;font-size:16px;letter-spacing:.03em}
.ui-v2 nav button.active,.ui-v2 button.active,.ui-v2 .guide-btn.active{outline:0;background:linear-gradient(#536879,#2d4053);border-color:#bddfff;box-shadow:inset 0 0 0 2px #7eacc5,inset 0 0 18px #9bd5ff24,0 2px 3px #0008;color:#fff}
.ui-v2 nav button.active:after{content:"◆";position:absolute;right:10px;color:#c5e8ff;font-size:11px;top:18px}
.ui-v2 main{padding:4px 22px 28px}
.ui-v2 .screen{padding:0!important;border:0!important;background:none!important;box-shadow:none!important}
.ui-v2 .screen:before{display:none!important}
.ui-v2 .screen .panel,.ui-v2 .combat,.ui-v2 .ui-box{border:1px solid #8a8d8d;border-radius:5px;background:linear-gradient(135deg,#34393fe8,#24282ef8);box-shadow:inset 0 0 0 3px #1a1e24,inset 0 0 0 4px #5a6068,0 4px 14px #0005;padding:18px;margin:0;min-width:0}
.ui-v2 .screen h2{font-size:19px;line-height:1.4;margin:0 0 14px;padding:0 0 10px;color:#eee6cf;border-bottom:1px solid #73777870;text-shadow:1px 2px #111}
.ui-v2 .screen h3{color:#dbd9d0;font-size:15px;border:0;padding:0;margin:18px 0 10px}
.ui-v2 .small{font-size:12px;line-height:1.65;color:#bfc3c9}
.ui-v2 .note{background:#1b252b!important;border:1px solid #566773!important;color:#dce9ef;border-radius:3px!important;line-height:1.6;padding:10px 12px;font-size:13px}
.ui-v2 .screen select{background:#1b1f25;border:1px solid #6c737b;min-height:44px;border-radius:3px;padding:9px;color:#f3eee4}
.ui-v2 .screen button.primary{background:linear-gradient(#647c50,#3b5239);border-color:#97af78}
.ui-v2 .screen button.gold{background:linear-gradient(#85704b,#58442e);border-color:#bca16e}
.ui-v2 .screen button.danger{background:linear-gradient(#71494d,#492d32);border-color:#a87980}
.ui-v2 .screen button.mode-toggle.is-on{background:linear-gradient(#526e57,#304934);border-color:#a3c28c}
.ui-v2 .screen button.mode-toggle.is-off{background:#292e36;color:#b7bec6}
.ui-v2 .barbg{height:10px;border:1px solid #090c0f;background:#161a20;border-radius:3px;box-shadow:inset 0 2px 3px #0008}
.ui-v2 .bar{background:linear-gradient(#adcb80,#728c54);border-radius:1px}
.ui-v2 .bar.blue{background:linear-gradient(#a8d4ed,#6086a1)}
.ui-v2 .bar.red{background:linear-gradient(#db9b95,#995856)}
.ui-v2 hr{border:0;border-top:1px solid #5e636b66;margin:18px 0}
.ui-v2 #field.active{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:14px;align-items:start}
.ui-v2 #field>.panel:first-child{padding:14px}

.ui-v2 #mainCard .mhead>.sprite{width:150px!important;height:130px!important;max-width:none;margin:20px auto 10px;filter:drop-shadow(0 9px 5px #0009)!important}
.ui-v2 #mainCard .mhead>div{background:#1b1919df;padding:10px;border:1px solid #867654;border-radius:3px}
.ui-v2 .mcard,.ui-v2 .codex-card,.ui-v2 .stat{background:#1c2129!important;border:1px solid #5c626a!important;border-radius:3px!important;box-shadow:inset 0 1px #ffffff08!important}
.ui-v2 .mcard{padding:12px;margin:10px 0}
.ui-v2 .mname{font-size:17px;color:#efe6cc;line-height:1.5}
.ui-v2 .trait{display:inline-block;font-size:12px;padding:5px 7px;margin:3px 3px 3px 0;background:#303d39;border:1px solid #52665a;border-radius:3px;white-space:normal}
.ui-v2 .trait.unique{background:#383441;border-color:#645971}
.ui-v2 .stats{gap:8px}
.ui-v2 .stat{padding:10px;min-width:0}
.ui-v2 .stat b{font-size:16px;overflow-wrap:anywhere;color:#e1e5d4}
.ui-v2 .ui-ranch-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.ui-v2 dialog.ranch-dialog{width:min(820px,calc(100vw - 28px));max-width:820px;max-height:min(88dvh,900px);margin:auto;padding:16px;overflow:auto;box-sizing:border-box;border:2px solid #b8a169;border-radius:8px;background:linear-gradient(145deg,#252b32,#14191f);color:#f5f0e3;box-shadow:inset 0 0 0 3px #10151b,0 18px 60px #000b}
.ui-v2 dialog.ranch-dialog::backdrop{background:#070b12c9;backdrop-filter:blur(3px)}
.ui-v2 .ranch-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #66727b}
.ui-v2 .ranch-dialog-head h2{margin:0;color:#f4dda1}
.ui-v2 .ranch-dialog>.panel{margin:0}
.ui-v2 dialog.team-change-dialog{width:min(720px,calc(100vw - 28px));max-width:720px}
.ui-v2 .team-change-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:12px 0 16px}
.ui-v2 .team-change-row{display:grid;grid-template-columns:minmax(76px,.65fr) minmax(0,1fr) auto;gap:8px;padding:7px 9px;border:1px solid #4b5c68;border-radius:4px;background:#171e26;font-size:12px;align-items:center}
.ui-v2 .team-change-row strong{color:#f4dda1}
.ui-v2 .team-change-values{font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:right}
.ui-v2 .team-change-direction{min-width:118px;padding:4px 7px;border-radius:4px;text-align:center;font-size:11px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.ui-v2 .team-change-direction.is-up{color:#b9f6d2;background:#174332;border:1px solid #438b68}
.ui-v2 .team-change-direction.is-down{color:#ffc2c2;background:#4a252a;border:1px solid #a9575f}
.ui-v2 .team-change-direction.is-same{color:#c4cbd1;background:#303840;border:1px solid #59636c}
.ui-v2 .team-change-actions{display:flex;justify-content:flex-end;gap:9px}
@media(max-width:560px){.ui-v2 .team-change-stats{grid-template-columns:1fr}.ui-v2 .team-change-row{grid-template-columns:minmax(85px,.65fr) minmax(0,1fr)}.ui-v2 .team-change-direction{grid-column:2;justify-self:end}}
.ui-v2 .ranch-inventory-dialog{width:min(1100px,calc(100vw - 28px));max-width:1100px}
.ui-v2 .ui-monster-select-row{display:flex;align-items:stretch;gap:8px;max-width:100%;margin:0 0 4px}
.ui-v2 .ui-monster-select-row select{width:min(100%,29em);max-width:100%;flex:0 1 29em;min-width:0}
.ui-v2 .ui-monster-select-row button{flex:0 0 9em;width:9em;white-space:nowrap;padding-inline:8px}
.ui-v2 #mainCard>.mcard{margin-top:4px}
.ui-v2 #monsterList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ui-v2 #monsterList .mcard{margin:0}
.ui-v2 #monsterList .mhead{align-items:start}
.ui-v2 #battle.active{display:grid;grid-template-columns:minmax(0,1fr) 272px;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;height:900px;box-sizing:border-box}
.ui-v2 .battle-control{grid-column:2;grid-row:1/3;height:900px;min-height:0;box-sizing:border-box;overflow-y:auto;align-self:start}
.ui-v2 .battle-control>.top{display:block}
.ui-v2 .battle-control .stage{font-size:16px;white-space:normal;border:1px solid #776a50;background:#2e2b26;color:#e6d7b4;border-radius:3px;padding:10px}
.ui-v2 .battle-control .stage-select{grid-template-columns:1fr;gap:12px}
.ui-v2 .battle-control>.row{display:grid;gap:10px}
.ui-v2 .battle-control .row>button{width:100%;flex:1;font-size:13px}

.ui-v2 #battle .combat{display:flex;flex-direction:column;border:0;border-radius:0;background:transparent;box-shadow:none;padding:20px 18px 16px;min-width:0}
.ui-v2 .combat .label,.ui-v2 .combat .enemy-name{color:#fff;text-shadow:1px 2px 3px #000,0 0 10px #000;font-size:16px}
.ui-v2 .combat .label{font-size:10px;letter-spacing:.12em;color:#d8e4ed}
.ui-v2 .combat .hp{background:#171d24dd;padding:8px;margin-top:auto;font-size:12px;flex-wrap:wrap;border-radius:3px}
.ui-v2 #teamSprites{min-height:166px;align-items:end}
.ui-v2 #teamSprites .sprite{width:105px!important;height:120px!important;filter:drop-shadow(0 7px 4px #0008);animation:slime-idle 2.8s ease-in-out infinite;transform-origin:center bottom}
.ui-v2 #enemySprite{height:166px;width:160px;margin:8px auto;filter:drop-shadow(0 7px 4px #0008)!important;animation:slime-idle 2.8s ease-in-out infinite;transform-origin:center bottom}
.ui-v2 .combat .top{flex-wrap:wrap}
.ui-v2 #lastHitDetail,.ui-v2 #advantage{background:#161d25df;padding:5px 8px;font-size:11px}
.ui-v2 #battle>.panel:last-child{grid-column:1;grid-row:2;height:100%;min-height:0;box-sizing:border-box;overflow:auto;align-self:stretch}
.ui-v2 #battleLog{max-height:170px;overflow:auto}
.ui-v2 .logline{background:#1b2027;border:0;border-left:2px solid #6b7a83;line-height:1.6;margin:4px 0;padding:6px 9px}
.ui-v2 #guide.active{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.ui-v2 #guide>.panel{position:sticky;top:80px}
.ui-v2 .guide-tabs{grid-template-columns:1fr}
.ui-v2 .guide-btn{text-align:left;font-size:14px;padding:12px}
.ui-v2 .guide-page{min-width:0}
.ui-v2 #guide p{font-size:14px;line-height:1.9}
.ui-v2 .codex-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ui-v2 dialog{color:var(--t);background:#282e36;border:2px solid #8b9299;border-radius:6px;max-width:min(720px,calc(100vw - 28px));max-height:85dvh;padding:22px;box-shadow:0 20px 80px #000b}
.ui-v2 dialog::backdrop{background:#080c13bb;backdrop-filter:blur(3px)}
.ui-v2 .ui-dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:15px}
.ui-v2 .ui-dialog-head h2{font-size:20px;margin:0}
.ui-v2 #uiSettings .audio-topbar{position:static;background:none;border:0;padding:0}
.ui-v2 #uiSettings .audio-topbar-inner{display:block}
.ui-v2 #uiSettings .bgm-controls{display:grid;grid-template-columns:1fr;gap:12px;padding:0;background:none}
.ui-v2 #uiSettings .bgm-controls>*{grid-column:auto;grid-row:auto}
.ui-v2 #uiSettings .bgm-controls input{width:100%}
.ui-v2 #uiSettings .sound-setting{margin-top:20px;padding:10px 0}

<script>
/* DOM presentation only: reuse game controls, handlers and state. */
document.addEventListener('DOMContentLoaded',()=>{
 const byId=id=>document.getElementById(id);
 document.body.classList.add('ui-v2');
 const fight=byId('battle')?.querySelector('.fight');
 const battleBackdrops={normal:['ruins','forest','frozen','volcanic'],boss:['eclipse','sky-fortress','crystal-cavern','world-tree']};
 const battleBackdropLoads=new Map();
 const preloadBattleBackdrop=scene=>{
  if(battleBackdropLoads.has(scene))return battleBackdropLoads.get(scene);
  const image=new Image();image.decoding='async';image.src=`assets/game-art/battle/${scene}.webp`;
  const loaded=(image.decode?image.decode():new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject})).catch(()=>{});
  battleBackdropLoads.set(scene,loaded);return loaded;
 };
 const syncBattleBackdrop=()=>{
  if(!fight)return;
  const stage=Number((byId('stageLabel')?.textContent.match(/\d+/)||[])[0])||1;
  const boss=byId('bossTag')?.style.display!=='none';
  const variant=battleBackdrops[boss?'boss':'normal'][Math.floor((stage-1)/5)%4];
  const scene=`${boss?'boss':'normal'}-${variant}`;
  if(fight.dataset.backdrop===scene)return;
  fight.dataset.backdrop=scene;
  preloadBattleBackdrop(scene).then(()=>{
   if(fight.dataset.backdrop===scene)fight.style.setProperty('--fight-backdrop',`url("assets/game-art/battle/${scene}.webp")`);
  });
 };
 syncBattleBackdrop();
 const battleSceneObserver=new MutationObserver(syncBattleBackdrop);
 ['stageLabel','bossTag'].forEach(id=>{const target=byId(id);if(target)battleSceneObserver.observe(target,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['style']})});
 const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
 const button=(text,action)=>{const b=make('button','',text);b.type='button';b.addEventListener('click',action);return b};
 const header=document.querySelector('body>header');
 const nav=document.querySelector('body>nav');
 const topbar=make('div');topbar.id='uiTopbar';header.before(topbar);topbar.append(header,nav);
 ['魔素フィールド','モンスター牧場','バトル','世界樹'].forEach((text,i)=>nav.children[i].textContent=text);
 nav.setAttribute('aria-label','メインメニュー');
 const syncNav=()=>nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.classList.contains('active')?'page':'false'));
 new MutationObserver(syncNav).observe(nav,{subtree:true,attributes:true,attributeFilter:['class']});syncNav();

 // Move the original audio controls into a native, keyboard-accessible dialog.
 const settings=make('dialog');settings.id='uiSettings';settings.setAttribute('aria-labelledby','uiSettingsTitle');
 const head=make('div','ui-dialog-head'),title=make('h2','','音と設定');title.id='uiSettingsTitle';
 head.append(title,button('閉じる ×',()=>settings.close()));settings.append(head,document.querySelector('.audio-topbar'));
 const sfxRow=make('div','ui-option-row'),sfxLabel=make('label','','効果音の音量');sfxLabel.htmlFor='uiSfxVolume';
 const sfxRange=make('input');sfxRange.id='uiSfxVolume';sfxRange.type='range';sfxRange.min='0';sfxRange.max='100';sfxRange.step='1';sfxRange.value=String(sfxVolume);
 const sfxOutput=make('output','',''+sfxVolume+'%');sfxOutput.htmlFor='uiSfxVolume';sfxRow.append(sfxLabel,sfxRange,sfxOutput);
 sfxRange.addEventListener('input',()=>{sfxVolume=Number(sfxRange.value);sfxOutput.value=sfxVolume+'%';sfxOutput.textContent=sfxOutput.value;try{localStorage.setItem('slimeRanchSfxVolume',String(sfxVolume))}catch{}});
 const motionRow=make('label','ui-motion-row'),motionToggle=make('input');motionToggle.type='checkbox';motionToggle.id='uiReducedMotion';
 const motionText=make('span','','画面演出を控えめにする');motionRow.append(motionToggle,motionText);
 try{motionToggle.checked=localStorage.getItem('slimeRanchReducedMotion')==='true'}catch{}
 document.body.classList.toggle('user-reduced-motion',motionToggle.checked);
 motionToggle.addEventListener('change',()=>{document.body.classList.toggle('user-reduced-motion',motionToggle.checked);try{localStorage.setItem('slimeRanchReducedMotion',String(motionToggle.checked))}catch{}});
 const resetRow=make('div','ui-reset-row'),resetNote=make('p','small','ゲームの進行状況と所持データを消去し、最初からやり直します。セーブのバックアップを書き出してから実行できます。');
 const resetGame=button('データ初期化',()=>byId('resetBtn').click());resetGame.id='uiResetGame';resetRow.append(resetNote,resetGame);
 const save=button('手動セーブ',()=>{byId('saveBtn').click();status.textContent='セーブしました。';});
 const status=make('p','ui-status','進行状況は自動保存されます。');status.setAttribute('role','status');
 settings.append(sfxRow,motionRow,resetRow,save,status);document.body.append(settings);
 settings.addEventListener('click',e=>{if(e.target===settings){const r=settings.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)settings.close();}});
 const gear=button('⚙',()=>settings.showModal());gear.id='uiSettingsButton';gear.className='ui-header-icon';gear.setAttribute('aria-label','音と設定を開く');gear.title='音量・効果音・手動セーブ';header.append(gear);
 const codex=button('📖',()=>showTab('guide'));codex.id='uiCodexButton';codex.className='ui-header-icon';codex.setAttribute('aria-label','冒険の書を開く');codex.title='冒険の書';header.insertBefore(codex,gear);
 const syncCodex=()=>{const active=byId('guide').classList.contains('active');codex.classList.toggle('active',active);codex.setAttribute('aria-current',active?'page':'false')};
 new MutationObserver(syncCodex).observe(byId('guide'),{attributes:true,attributeFilter:['class']});syncCodex();

 // Field: keep the real canvas and collect controls; add read-only statistics.
 const fieldPanels=byId('field').querySelectorAll(':scope > .panel');
 fieldPanels[1].classList.add('field-upgrades');
 const facts=make('div','ui-field-facts');facts.innerHTML='<h2>フィールド情報</h2><div class="ui-fact"><span>採集量 / 1マス</span><b id="uiYield"></b></div><div class="ui-fact"><span>自然湧き間隔</span><b id="uiSpawn"></b></div><div class="ui-fact"><span>採集範囲</span><b id="uiRange"></b></div>';
 fieldPanels[1].prepend(facts);
 const odds=byId('treasureOdds'),oddsText=odds.textContent.replace(/^宝箱出現確率：?\s*/, '');odds.className='ui-fact';odds.innerHTML='<span>宝箱出現確率</span><b>'+oddsText+'</b>';facts.append(odds);
 // Avoid a tiny initial 2×2 board while retaining the same 720px coordinate system.
 fieldGeom=function(){const n=size(),cell=720/n;return {n,cell,off:0}};
 byId('fieldCanvas').setAttribute('aria-label','魔素フィールド。結晶やモンスターのマスをタップして採集');
  // Ranch workflows live in focused modal windows so the overview stays compact.
  const ranch=byId('ranch'),actions=byId('ranchActions');
  actions.addEventListener('click',()=>nav.querySelectorAll('button').forEach(tab=>tab.blur()),true);
 function addMonsterSelectRow(selectId,slot,label){const select=byId(selectId),row=make('div','ui-monster-select-row ui-monster-select-row--'+slot);select.before(row);row.append(select,button(label,()=>treasureDialog(slot)));}
 addMonsterSelectRow('mainSelect','main','宝箱/装備');
 addMonsterSelectRow('subSelect','sub','宝箱/装備');
  const sideStack=make('div','ranch-side-stack');
 sideStack.append(byId('ranchTeamStats'));
 const subPanel=make('div','panel');subPanel.id='uiSubCompanion';subPanel.append(make('h2','','サブモンスター'));
 const subSelectLabel=ranch.querySelector('label[for="subSelect"]');if(subSelectLabel)subPanel.append(subSelectLabel);
 subPanel.append(byId('subSelect').parentElement,byId('subCard'));
 sideStack.append(subPanel);ranch.querySelector('.ranch-layout').append(sideStack);
 const wrapIdleSprite=(root,kind)=>root.querySelectorAll('.mhead>.sprite').forEach(img=>{
  if(img.parentElement.classList.contains('ui-monster-idle-motion'))return;
  const motion=make('span','ui-monster-idle-motion ui-monster-idle-motion--'+kind);
  img.before(motion);motion.append(img);
 });
 const mainSpriteObserver=new MutationObserver(()=>wrapIdleSprite(byId('mainCard'),'main'));
 const subSpriteObserver=new MutationObserver(()=>wrapIdleSprite(byId('subCard'),'sub'));
 mainSpriteObserver.observe(byId('mainCard'),{childList:true,subtree:true});
 subSpriteObserver.observe(byId('subCard'),{childList:true,subtree:true});
 wrapIdleSprite(byId('mainCard'),'main');wrapIdleSprite(byId('subCard'),'sub');

 // Battle: stage and automation in a side panel, combatants share one scene.
 const battlePanel=byId('battle').querySelector(':scope > .panel');battlePanel.classList.add('battle-control');
 battlePanel.insertBefore(byId('attack'),battlePanel.querySelector('.stage-select'));
 battlePanel.append(byId('battleMsg'),byId('lastHitDetail'),byId('advantage'));
 // Keep the calculation reference available without crowding the partner screen.
 const baseExplanation=statExplain;
 statExplain=function(){return '<details class="ui-stat-details"><summary>ステータスの計算方法</summary>'+baseExplanation()+'</details>';};
 const currentExplanation=byId('ranchTeamStats').querySelector('.stat-explain');
 if(currentExplanation){const details=make('details','ui-stat-details');currentExplanation.before(details);details.append(make('summary','','ステータスの計算方法'),currentExplanation);}
 // Book: existing guide pages remain intact and accessible.
 const guideIntro=byId('guide').querySelector(':scope > .panel > .small');
 guideIntro.textContent='育成の手引きと、冒険の記録。';
 document.querySelector('footer').textContent='SLIME RANCH  /  スライム牧場';
 const updateFacts=()=>{
  byId('uiYield').textContent=fmt(magicYield())+' 魔素';
  byId('uiSpawn').textContent=(spawnIntervalMs()/1000).toFixed(2)+' 秒';
  byId('uiRange').textContent=collectRangeLabel();
 };
 const factsObserver=new MutationObserver(updateFacts);
 ['spawnUpLabel','yieldLabel','rangeLabel'].forEach(id=>factsObserver.observe(byId(id),{subtree:true,characterData:true,childList:true}));
 updateFacts();drawField();
});

</script>
