<style id="slime-opening-screen">
body.opening-active{height:100dvh;min-height:0;overflow:hidden}
html.opening-active{scrollbar-gutter:auto}
body.opening-active>*:not(#openingScreen):not(dialog){display:none!important}
#openingScreen[hidden]{display:none!important}
#openingScreen{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;overflow:auto;padding:clamp(16px,4vw,48px);isolation:isolate;background:#10131a;color:#f7f0de;opacity:1;transition:opacity .5s ease}
.opening-art,.opening-shade{position:absolute;inset:0;z-index:-1;pointer-events:none}
.opening-art{overflow:hidden;background:#10131a}
.opening-art img{position:absolute;inset:0;width:100%;height:100%}
.opening-art .opening-art-fill{display:none}
.opening-art .opening-art-main{object-fit:cover;object-position:center;transform-origin:center;filter:saturate(.92);animation:opening-drift 20s ease-in-out infinite alternate}
.opening-shade{background:linear-gradient(90deg,#0a0e13b8 0%,#10141b70 35%,#11172130 68%,#10141b55 100%),linear-gradient(0deg,#0a0d12d9 0%,#0a0d1266 20%,transparent 55%,#10131a70 100%);animation:opening-light 12s ease-in-out infinite alternate}
.opening-frame{box-sizing:border-box;width:min(360px,100%);margin:0 0 0 auto;padding:clamp(18px,3vw,24px);border:2px solid #b49a60;border-radius:8px;background:linear-gradient(145deg,#252a30eb,#151a20e8);box-shadow:inset 0 0 0 3px #11151a,inset 0 0 0 4px #71634a,0 22px 70px #0009;backdrop-filter:blur(4px);text-align:center;transform:translateX(clamp(0px,3vw,32px));animation:opening-frame-enter .68s cubic-bezier(.18,.76,.22,1) both;transition:opacity .16s ease,transform .2s cubic-bezier(.2,.8,.2,1),visibility 0s linear .16s}
.opening-kicker{margin:0 0 11px;color:#b5d4e5;font-size:clamp(11px,2vw,14px);letter-spacing:.22em;text-transform:uppercase}
.opening-title{margin:0;color:#f3dfab;font-size:clamp(32px,4vw,48px);line-height:1.12;letter-spacing:.04em;text-shadow:0 3px #30271a,0 6px #080a0d,0 0 24px #f8d88e55}
.opening-title-sub{margin:9px 0 0;color:#f5f0e7;font-size:clamp(13px,1.2vw,16px);letter-spacing:.04em;text-shadow:0 2px 6px #000}
.opening-rule{display:flex;align-items:center;gap:12px;margin:23px 0 17px;color:#dfc887;font-size:12px;letter-spacing:.2em}
.opening-rule:before,.opening-rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#b59b61)}
.opening-rule:after{transform:scaleX(-1)}
.opening-menu{display:grid;gap:10px;width:min(300px,100%);margin:auto}
.opening-menu button{min-height:52px;border:1px solid #8d9292;border-radius:4px;background:linear-gradient(#555b60,#32383e 50%,#252a30);box-shadow:inset 0 1px #ffffff30,inset 0 -3px #11151a,0 3px #0b0e12;color:#f1eee5;font:inherit;font-size:16px;letter-spacing:.13em;text-shadow:0 2px #111;transition:filter .15s,transform .15s,border-color .15s}
.opening-menu button:hover{filter:brightness(1.2);border-color:#d8c184;transform:translateY(-1px)}
.opening-menu button:active{transform:translateY(1px)}
.opening-menu .opening-start{border-color:#cfb66e;background:linear-gradient(#8a794e,#5b5137 50%,#393427);color:#fff2c7;font-weight:900;box-shadow:inset 0 1px #fff7d44d,inset 0 -3px #292317,0 3px #0b0e12,0 0 18px #e2c47840}
.opening-menu .opening-option{font-size:14px}
.opening-save-hint{margin:17px 0 0;color:#d0d2d1;font-size:12px;text-shadow:0 1px 4px #000;line-height:1.7}
.opening-status{min-height:1.5em;margin:11px 0 0;color:#ffe3a0;font-size:12px;line-height:1.6}
.opening-copyright{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#e6e5e1b3;font-size:10px;letter-spacing:.12em;text-shadow:0 2px 5px #000}
#openingScreen.is-starting{opacity:0;pointer-events:none}
#openingScreen.is-starting .opening-frame{opacity:0;visibility:hidden;transform:translateY(-16px) scale(.98)}
#openingScreen.is-starting .opening-art-main{animation:none;transform:scale(1.12);filter:brightness(1.16) saturate(1.08);transition:transform .38s ease,filter .38s ease}
.ui-v2 dialog.opening-confirm{width:min(440px,calc(100vw - 32px));max-width:440px;padding:26px;border-color:#b49a60;background:linear-gradient(145deg,#292e34,#171c22);color:#f7f0de;text-align:center}
.ui-v2 dialog.opening-confirm::backdrop{background:#080c13d9;backdrop-filter:blur(4px)}
.opening-confirm h2{margin:0 0 12px;color:#ffe2a1;font-size:22px}
.opening-confirm p{margin:0;color:#e2e0d9;line-height:1.8}
.opening-confirm-actions{display:flex;justify-content:center;gap:12px;margin-top:22px}
.opening-confirm-actions button{min-width:128px;min-height:44px;border:2px solid #7a8992;border-radius:4px;background:linear-gradient(#4a535c,#28313a);color:#f7f0de;font:inherit;cursor:pointer}
.opening-confirm-actions button:hover{filter:brightness(1.15)}
.opening-confirm-actions #confirmGameEnd{border-color:#c17d78;background:linear-gradient(#804c4b,#513034)}
.ui-v2 #uiSettings{width:min(650px,calc(100vw - 24px))}
.ui-v2 .ui-option-row{display:grid;grid-template-columns:minmax(130px,190px) minmax(100px,1fr) auto;gap:12px;align-items:center;margin:14px 0;padding:12px;border:1px solid #626a6c;background:#20252b;border-radius:4px}
.ui-v2 .ui-option-row label{margin:0;color:#e3dfd3}
.ui-v2 .ui-option-row input[type=range]{width:100%;accent-color:#d4bd7a}
.ui-v2 .ui-option-row output{min-width:42px;text-align:right;color:#f1dc9e;font-variant-numeric:tabular-nums}
.ui-v2 .ui-motion-row{display:flex;align-items:center;gap:10px;margin:14px 0;padding:12px;border:1px solid #626a6c;background:#20252b;border-radius:4px}
.ui-v2 .ui-motion-row input{width:20px;height:20px;accent-color:#a7c681}
.ui-v2 .ui-reset-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:13px;border:1px solid #805859;background:#302326;border-radius:4px}
.ui-v2 .ui-reset-row .small{flex:1}
.ui-v2 #uiResetGame{border-color:#c17d78;background:linear-gradient(#804c4b,#513034);white-space:nowrap}
.ui-v2.user-reduced-motion *,.ui-v2.user-reduced-motion *::before,.ui-v2.user-reduced-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@keyframes opening-drift{from{transform:scale(1.035)}to{transform:scale(1.11)}}
@keyframes opening-light{from{opacity:.88}to{opacity:1}}
@keyframes opening-frame-enter{from{opacity:0;transform:translate(clamp(0px,3vw,32px),14px) scale(.985)}to{opacity:1;transform:translateX(clamp(0px,3vw,32px)) scale(1)}}
@media(min-width:1500px){.opening-frame{margin-right:clamp(128px,9vw,170px)}}
@media(min-width:1800px){.opening-frame{margin-right:clamp(200px,14vw,270px)}}
@media(max-width:700px){#openingScreen{padding:12px;overflow:hidden}.opening-art .opening-art-main{object-position:center 58%}.opening-shade{background:linear-gradient(0deg,#0b0e13e8,#11151b4a 58%,#11151b80)}.opening-frame{width:min(460px,100%);margin:auto;padding:22px 18px;transform:none}.opening-menu{gap:8px}.opening-menu button{min-height:48px}.opening-copyright{bottom:7px}.opening-confirm-actions{gap:8px}.opening-confirm-actions button{min-width:0;flex:1}.ui-v2 .ui-option-row{grid-template-columns:1fr auto;gap:7px}.ui-v2 .ui-option-row label{grid-column:1/-1}.ui-v2 .ui-option-row input[type=range]{grid-column:1}.ui-v2 .ui-option-row output{grid-column:2;grid-row:2}.ui-v2 .ui-reset-row{align-items:stretch;flex-direction:column}}
@media(max-width:700px) and (orientation:portrait){#openingScreen{display:block;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.opening-art .opening-art-main{inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:center 64%}.opening-frame{position:relative;width:min(380px,100%);max-height:calc(100dvh - 24px);overflow:auto;margin:0 auto;padding:clamp(12px,3.2vh,20px) 16px}.opening-kicker{margin-bottom:7px;font-size:10px}.opening-title{font-size:clamp(28px,8vw,36px)}.opening-title-sub{margin-top:6px;font-size:clamp(12px,3.5vw,14px)}.opening-rule{margin:12px 0 9px;font-size:10px}.opening-menu{gap:6px}.opening-menu button{min-height:42px;font-size:14px}.opening-menu .opening-option{font-size:12px}.opening-save-hint{margin-top:10px;font-size:10px;line-height:1.5}.opening-status{margin-top:5px;font-size:10px}.opening-copyright{bottom:5px;font-size:8px}.opening-frame{animation:opening-frame-enter-mobile .55s cubic-bezier(.18,.76,.22,1) both}}
@media(max-width:1000px) and (orientation:landscape) and (max-height:520px){#openingScreen{display:grid;place-items:center;padding:8px;overflow:hidden}.opening-frame{width:min(44vw,360px);max-height:calc(100dvh - 16px);overflow:auto;margin:0 8px 0 auto;padding:10px 16px;animation:opening-frame-enter-mobile .45s cubic-bezier(.18,.76,.22,1) both}.opening-kicker{margin-bottom:4px;font-size:9px}.opening-title{font-size:clamp(25px,6vh,36px)}.opening-title-sub{margin-top:4px;font-size:12px}.opening-rule{margin:8px 0 6px;font-size:9px}.opening-menu{gap:5px}.opening-menu button{min-height:36px;font-size:13px}.opening-save-hint{margin-top:7px;font-size:9px;line-height:1.35}.opening-status{margin-top:4px;font-size:9px}.opening-copyright{bottom:2px;font-size:7px}}
@keyframes opening-frame-enter-mobile{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.opening-art .opening-art-main{animation:none}.opening-shade{animation:none}#openingScreen,#openingScreen .opening-frame,#openingScreen .opening-art-main{transition:none!important;animation:none!important}.opening-menu button{transition:none}}
</style>
<div id="openingScreen" role="dialog" aria-modal="true" aria-labelledby="openingTitle">
 <div class="opening-art" aria-hidden="true"><img class="opening-art-fill" src="assets/title-screen.png" alt=""><img id="openingArtwork" class="opening-art-main" src="assets/title-screen.png" data-fallback="https://spf33yk.github.io/SlimeRanch/assets/title-screen.png" alt=""></div>
 <div class="opening-shade" aria-hidden="true"></div>
 <section class="opening-frame">
  <p class="opening-kicker">A PIXEL FANTASY ADVENTURE</p>
  <h1 class="opening-title" id="openingTitle">スライム牧場</h1>
  <p class="opening-title-sub">魔素を集めて、君だけの牧場を育てよう</p>
  <div class="opening-rule" aria-hidden="true">MAIN MENU</div>
  <div class="opening-menu">
   <button id="gameStart" class="opening-start" type="button">GAME START</button>
   <button id="gameOption" class="opening-option" type="button">OPTION</button>
   <button id="gameEnd" class="opening-option" type="button">GAME END</button>
  </div>
  <p class="opening-save-hint">セーブデータはこのブラウザーに自動保存されます。<br>保存データがあれば、続きから再開します。</p>
  <p class="opening-status" id="openingStatus" role="status" aria-live="polite"></p>
 </section>
 <div class="opening-copyright">SLIME RANCH · GROW YOUR OWN MONSTER RANCH</div>
</div>
<dialog id="gameEndDialog" class="opening-confirm" aria-labelledby="gameEndTitle" aria-describedby="gameEndDescription">
 <h2 id="gameEndTitle">ゲームを終了しますか？</h2>
 <p id="gameEndDescription">現在の進行をセーブして終了します。<br>ブラウザーの仕様により、タブが自動で閉じない場合があります。</p>
 <div class="opening-confirm-actions">
  <button id="cancelGameEnd" type="button">ゲームに戻る</button>
  <button id="confirmGameEnd" type="button">終了する</button>
 </div>
</dialog>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const screen=document.getElementById('openingScreen'),status=document.getElementById('openingStatus');
 const endDialog=document.getElementById('gameEndDialog');
 const artwork=document.getElementById('openingArtwork');
 artwork.addEventListener('error',()=>{if(artwork.dataset.fallback&&artwork.src!==artwork.dataset.fallback)artwork.src=artwork.dataset.fallback},{once:true});
 if(window.__SLIME_E2E__){screen.hidden=true;return}
 document.body.classList.add('opening-active');document.documentElement.classList.add('opening-active');
 document.getElementById('gameStart').addEventListener('click',()=>{
  if(screen.classList.contains('is-starting'))return;
  if(typeof sfx==='function')sfx('win');
  screen.classList.add('is-starting');
  const motionOff=matchMedia('(prefers-reduced-motion: reduce)').matches||document.body.classList.contains('user-reduced-motion');
  window.setTimeout(()=>{
   screen.hidden=true;document.body.classList.remove('opening-active');document.documentElement.classList.remove('opening-active');
   if(typeof showTab==='function')showTab('field');
   if(typeof window.startFirstRunTutorial==='function')window.startFirstRunTutorial();
   window.scrollTo({top:0,behavior:motionOff?'auto':'smooth'});
  },motionOff?0:520);
 });
 document.getElementById('gameOption').addEventListener('click',()=>{
  if(typeof sfx==='function')sfx('tab');
  const gear=document.getElementById('uiSettingsButton');
  if(gear){gear.click();screen.setAttribute('aria-modal','false');const settings=document.getElementById('uiSettings');settings?.addEventListener('close',()=>screen.setAttribute('aria-modal','true'),{once:true})}else status.textContent='設定を読み込み中です。少し待ってもう一度お試しください。';
 });
 document.getElementById('gameEnd').addEventListener('click',()=>{
  if(typeof sfx==='function')sfx('tab');
  endDialog.showModal();
  document.getElementById('cancelGameEnd').focus();
 });
 document.getElementById('cancelGameEnd').addEventListener('click',()=>{if(typeof sfx==='function')sfx('tap');endDialog.close()});
 document.getElementById('confirmGameEnd').addEventListener('click',()=>{
  if(typeof sfx==='function')sfx('fail');
  if(typeof save==='function')save();
  endDialog.close();
  status.textContent='セーブしました。ゲームを終了しました。ブラウザーの仕様により閉じられない場合は、このタブを閉じてください。';
  window.setTimeout(()=>window.close(),250);
 });
});
</script>
